<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vending Machine - AFD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<header>
<h1>Vending Machine</h1>
<p>Máquina de venda modelada com Autômato Finito Determinístico</p>
</header>

<section class="machine">
<p>⭐ ESCOLHA SEU PRODUTO ⭐</p>
<div class="display">
<span>VALOR INSERIDO</span>
<strong id="amount">R$ 0,00</strong>
<small id="state">Estado atual: q0</small>
</div>

<h3>Insira uma moeda</h3>
<div class="coins">
<button data-coin="5">🪙 5¢</button>
<button data-coin="10">🪙 10¢</button>
<button data-coin="25">🪙 25¢</button>
</div>

<h3 class="section-label">Escolha um produto</h3>
<div class="products" id="products">
<button class="product" data-product="Refrigerante" disabled>
<span class="product-icon">🥤</span>
<span class="product-name">Refrigerante</span>
<span class="product-price">R$ 0,30</span>
</button>
<button class="product" data-product="Chocolate" disabled>
<span class="product-icon">🍫</span>
<span class="product-name">Chocolate</span>
<span class="product-price">R$ 0,30</span>
</button>
<button class="product" data-product="Biscoito" disabled>
<span class="product-icon">🍪</span>
<span class="product-name">Biscoito</span>
<span class="product-price">R$ 0,30</span>
</button>
</div>

<div id="message" class="message">Insira moedas para continuar.</div>
<button id="buy" class="buy" disabled>COMPRAR</button>
<button id="reset" class="reset">↻ Reiniciar</button>
</section>

<section class="automaton">
<h2>Transições do Autômato</h2>
<div id="transition" class="transition">q0</div>
<p id="transitionText">Nenhuma transição realizada.</p>
<h3>Histórico</h3>
<ul id="history"></ul>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
